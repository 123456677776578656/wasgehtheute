name: Android App Bundle bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android App Bundle bauen
        working-directory: android
        run: gradle :app:bundleRelease --stacktrace

      - name: App Bundle bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: wasgehtheute-android-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
